<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Task Manager — Rana Yasir Mahy Ud Din</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-xl shadow-lg">KM</div>
        <span class="text-lg font-bold tracking-wider">KanbanFlow Enterprise</span>
      </div>
      <div class="text-xs text-slate-400">
        Developer: <span class="text-indigo-400 font-medium">Rana Yasir Mahy Ud Din</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight mb-1">Task Management Board</h1>
        <p class="text-slate-400 text-sm">Organize, track, and manage project workflows in real time.</p>
      </div>
      <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/20 text-sm">
        + Add New Task
      </button>
    </div>

    <!-- Kanban Board Columns -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- To Do Column -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
          <h3 class="font-bold text-sm text-amber-400 flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
            <span>To Do</span>
          </h3>
          <span id="count-todo" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full font-semibold">0</span>
        </div>
        <div id="col-todo" class="space-y-3 flex-grow min-h-[300px]"></div>
      </div>

      <!-- In Progress Column -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
          <h3 class="font-bold text-sm text-indigo-400 flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-indigo-400"></span>
            <span>In Progress</span>
          </h3>
          <span id="count-in-progress" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full font-semibold">0</span>
        </div>
        <div id="col-in-progress" class="space-y-3 flex-grow min-h-[300px]"></div>
      </div>

      <!-- Done Column -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
          <h3 class="font-bold text-sm text-emerald-400 flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
            <span>Completed</span>
          </h3>
          <span id="count-done" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full font-semibold">0</span>
        </div>
        <div id="col-done" class="space-y-3 flex-grow min-h-[300px]"></div>
      </div>
    </div>
  </main>

  <!-- Add Task Modal -->
  <div id="task-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">Create New Task</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white">&times;</button>
      </div>
      <form id="task-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Task Title</label>
          <input type="text" id="task-title" required placeholder="e.g. Update API documentation" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Description</label>
          <textarea id="task-desc" rows="3" placeholder="Task details and sub-goals..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Status</label>
            <select id="task-status" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Completed</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Priority</label>
            <select id="task-priority" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>
        <div class="flex space-x-3 pt-2">
          <button type="button" onclick="closeModal()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 rounded-xl transition-all text-sm">Cancel</button>
          <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/20 text-sm">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-800 bg-slate-900/40 py-6 text-center text-xs text-slate-500">
    © 2026 Rana Yasir Mahy Ud Din • Kanban Task Management REST API
  </footer>

  <script>
    let allTasks = [];

    async function fetchTasks() {
      try {
        const res = await fetch('/api/tasks');
        const json = await res.json();
        if (json.success) {
          allTasks = json.data;
          renderKanban();
        }
      } catch (err) {
        console.error('Error fetching tasks:', err);
      }
    }

    function renderKanban() {
      const todoCol = document.getElementById('col-todo');
      const inProgCol = document.getElementById('col-in-progress');
      const doneCol = document.getElementById('col-done');

      const todoTasks = allTasks.filter(t => t.status === 'todo');
      const inProgTasks = allTasks.filter(t => t.status === 'in-progress');
      const doneTasks = allTasks.filter(t => t.status === 'done');

      document.getElementById('count-todo').innerText = todoTasks.length;
      document.getElementById('count-in-progress').innerText = inProgTasks.length;
      document.getElementById('count-done').innerText = doneTasks.length;

      todoCol.renderTasks = todoTasks;
      todoCol.innerHTML = renderCards(todoTasks);
      inProgCol.innerHTML = renderCards(inProgTasks);
      doneCol.innerHTML = renderCards(doneTasks);
    }

    function renderCards(tasksList) {
      if (tasksList.length === 0) {
        return `<div class="text-xs text-slate-600 text-center py-8 border border-dashed border-slate-800 rounded-xl">No tasks here</div>`;
      }

      return tasksList.map(t => {
        const priorityColor = t.priority === 'High' ? 'text-red-400 bg-red-500/10' : t.priority === 'Medium' ? 'text-amber-400 bg-amber-500/10' : 'text-emerald-400 bg-emerald-500/10';
        return `
          <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-4 shadow-sm hover:border-slate-700 transition-all">
            <div class="flex justify-between items-start mb-2">
              <h4 class="font-bold text-sm text-slate-100">${t.title}</h4>
              <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ${priorityColor}">${t.priority}</span>
            </div>
            <p class="text-xs text-slate-400 mb-3">${t.description || 'No description provided.'}</p>
            <div class="flex justify-between items-center pt-2 border-t border-slate-900 text-xs">
              <div class="flex space-x-1">
                ${t.status !== 'todo' ? `<button onclick="updateStatus(${t.id}, 'todo')" class="text-slate-400 hover:text-white px-1.5 py-0.5 bg-slate-900 rounded">←</button>` : ''}
                ${t.status !== 'in-progress' ? `<button onclick="updateStatus(${t.id}, 'in-progress')" class="text-indigo-400 hover:text-indigo-300 px-1.5 py-0.5 bg-indigo-500/10 rounded">In Prog</button>` : ''}
                ${t.status !== 'done' ? `<button onclick="updateStatus(${t.id}, 'done')" class="text-emerald-400 hover:text-emerald-300 px-1.5 py-0.5 bg-emerald-500/10 rounded">Done →</button>` : ''}
              </div>
              <button onclick="deleteTask(${t.id})" class="text-red-400 hover:text-red-300">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal() {
      document.getElementById('task-modal').classList.remove('hidden');
      document.getElementById('task-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('task-modal').classList.add('hidden');
      document.getElementById('task-modal').classList.remove('flex');
    }

    document.getElementById('task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('task-title').value;
      const description = document.getElementById('task-desc').value;
      const status = document.getElementById('task-status').value;
      const priority = document.getElementById('task-priority').value;

      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, status, priority })
        });
        const json = await res.json();
        if (json.success) {
          closeModal();
          document.getElementById('task-form').reset();
          fetchTasks();
        }
      } catch (err) {
        alert('Failed to create task.');
      }
    });

    async function updateStatus(id, newStatus) {
      try {
        const res = await fetch(`/api/tasks/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        const json = await res.json();
        if (json.success) {
          fetchTasks();
        }
      } catch (err) {
        alert('Failed to update task status.');
      }
    }

    async function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      try {
        const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          fetchTasks();
        }
      } catch (err) {
        alert('Failed to delete task.');
      }
    }

    fetchTasks();
  </script>
</body>
</html>
